<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nocturne - Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --border: #1c1c1c;
      --grey: rgb(117, 117, 117);
      --grey-glow: rgba(255, 255, 255, 0.13);
      --white: #ebebeb;
      --sub: #a0a0a0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 55% 35% at 50% 18%, rgba(255, 255, 255, 0.06) 0%, transparent 100%),
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 100% 100%, 52px 52px, 52px 52px;
      color: var(--white);
      font-family: 'Geist', 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 30px 0 0;
      flex-shrink: 0;
      animation: fade-up 0.55s ease both;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--white);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
      width: 100%;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(36px, 5.2vw, 64px);
      font-weight: 700;
      line-height: 1.03;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
      color: var(--white);
      animation: fade-up 0.6s 0.12s ease both;
    }

    h1 .accent {
      color: var(--white);
    }

    .desc {
      font-size: 15px;
      color: var(--sub);
      margin-bottom: 28px;
      font-weight: 500;
      letter-spacing: 0.005em;
      animation: fade-up 0.6s 0.22s ease both;
    }

    .ctas {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
      animation: fade-up 0.6s 0.32s ease both;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      background: var(--white);
      color: #000000;
      text-decoration: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 28px;
      border-radius: 8px;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 22px var(--grey-glow);
      transition: background 0.2s, transform 0.15s;
    }

    .btn-download:hover {
      background: #636363;
      transform: translateY(-1px);
    }

    .editor-img {
      width: 100%;
      max-width: 600px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04), 0 0 22px rgba(255, 255, 255, 0.28);
      display: block;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      will-change: transform;
      animation: fade-in 0.7s 0.42s ease both;
    }

    .editor-img img {
      width: 100%;
      display: block;
    }

    footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 48px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      animation: fade-up 0.5s 0.55s ease both;
    }

    .foot-left {
      font-size: 14px;
      color: var(--sub);
      font-weight: 500;
    }

    .foot-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
      color: var(--sub);
      font-weight: 500;
    }

    footer a {
      font-size: 14px;
      color: var(--sub);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--white);
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Nocturne</div>
  </header>

  <main>
    <h1>
      Execute Without<br />
      <span class="accent">Compromise.</span>
    </h1>

    <p class="desc">Nocturne is a free, powerful 100% sUNC executor with extra features for script developers.</p>

    <div class="ctas">
      <a class="btn-download" href="Files/Fluxity.exe">Download</a>
    </div>

    <div class="editor-img" id="editor">
      <img src="editor.png" alt="Nocturne executor UI" />
    </div>
  </main>

  <footer>
    <div class="foot-left">
      <a href="https://discord.gg/kuKGNdZrdA" target="_blank">Discord</a>
    </div>
    <div class="foot-right">
      <span>2026 &copy; Nocturne</span>
      <a href="terms.html">Terms</a>
    </div>
  </footer>

  <script>
    const editor = document.getElementById('editor');

    document.addEventListener('mousemove', function (e) {
      const rect = editor.getBoundingClientRect();
      const dx = (e.clientX - (rect.left + rect.width / 2)) / (window.innerWidth / 2);
      const dy = (e.clientY - (rect.top + rect.height / 2)) / (window.innerHeight / 2);

      const rotateX = dy * -5;
      const rotateY = dx * 5;
      editor.style.transform = 'perspective(900px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale(1.012)';

      const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 1);
      const glow = 12 + dist * 22;
      editor.style.boxShadow = '0 28px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04), 0 0 ' + glow + 'px rgba(255,255,255,' + (0.28 + dist * 0.35) + ')';
    });
  </script>
</body>
</html>
